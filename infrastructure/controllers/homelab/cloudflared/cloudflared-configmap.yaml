apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflared
data:
  config.yaml: |
    tunnel: ldhomelab
    credentials-file: /etc/cloudflared/creds/credentials.json

    metrics: 0.0.0.0:2000
    no-autoupdate: true

    ingress:
      - hostname: linkding.vandesteeg.dev
        service: http://linkding.linkding.svc.cluster.local:9090
      - service: http_status:404
