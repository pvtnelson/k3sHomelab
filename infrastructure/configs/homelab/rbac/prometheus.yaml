# Kubernetes identities for Prometheus (LifeOS server, outside the cluster).
# Not related to the in-cluster kube-prometheus-stack Prometheus.
#   prometheus-ro:  read-only (view + cluster-scoped reads + Flux objects)
#   prometheus-ops: same reads + rollout restart, scale, delete pod, cordon/drain, Flux reconcile/suspend/resume
# Neither may read secrets, create/delete workloads, exec, port-forward, or touch RBAC/CRDs/namespaces.
# Tokens are minted by Kubernetes into the *-token Secrets; no secret values are stored in git.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus-cluster-read
rules:
  - apiGroups: [""]
    resources: ["nodes", "namespaces", "persistentvolumes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingressclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["nodes", "pods"]
    verbs: ["get", "list", "watch"]
  # Monitoring, certificate and ingress objects, to check them without asking Niels (read-only, no secrets).
  - apiGroups: ["monitoring.coreos.com"]
    resources: ["servicemonitors", "podmonitors", "probes", "scrapeconfigs", "prometheusrules", "prometheuses", "alertmanagers"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["cert-manager.io"]
    resources: ["clusterissuers", "issuers", "certificates", "certificaterequests"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["traefik.io"]
    resources: ["ingressroutes", "middlewares", "tlsstores", "tlsoptions"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["helm.cattle.io"]
    resources: ["helmcharts", "helmchartconfigs"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus-flux-read
rules:
  - apiGroups:
      - source.toolkit.fluxcd.io
      - kustomize.toolkit.fluxcd.io
      - helm.toolkit.fluxcd.io
      - notification.toolkit.fluxcd.io
      - image.toolkit.fluxcd.io
    resources: ["*"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus-ops
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch", "patch"] # rollout restart
  - apiGroups: ["apps"]
    resources: ["deployments/scale", "statefulsets/scale"]
    verbs: ["get", "patch", "update"] # scale
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["delete"] # restart a stuck pod
  - apiGroups: [""]
    resources: ["pods/eviction"]
    verbs: ["create"] # drain
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["patch"] # cordon
  - apiGroups: ["kustomize.toolkit.fluxcd.io"]
    resources: ["kustomizations"]
    verbs: ["patch"] # reconcile, suspend, resume
  - apiGroups: ["helm.toolkit.fluxcd.io"]
    resources: ["helmreleases"]
    verbs: ["patch"]
  - apiGroups: ["source.toolkit.fluxcd.io"]
    resources: ["gitrepositories", "helmrepositories", "ocirepositories"]
    verbs: ["patch"]
---
# Identity A: read-only
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus-ro
  namespace: kube-system
---
apiVersion: v1
kind: Secret
metadata:
  name: prometheus-ro-token
  namespace: kube-system
  annotations:
    kubernetes.io/service-account.name: prometheus-ro
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus-ro-view
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: ServiceAccount
    name: prometheus-ro
    namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus-ro-cluster-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus-cluster-read
subjects:
  - kind: ServiceAccount
    name: prometheus-ro
    namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus-ro-flux-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus-flux-read
subjects:
  - kind: ServiceAccount
    name: prometheus-ro
    namespace: kube-system
---
# Identity B: operations (used only inside written runbooks)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus-ops
  namespace: kube-system
---
apiVersion: v1
kind: Secret
metadata:
  name: prometheus-ops-token
  namespace: kube-system
  annotations:
    kubernetes.io/service-account.name: prometheus-ops
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus-ops-view
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: ServiceAccount
    name: prometheus-ops
    namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus-ops-cluster-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus-cluster-read
subjects:
  - kind: ServiceAccount
    name: prometheus-ops
    namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus-ops-flux-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus-flux-read
subjects:
  - kind: ServiceAccount
    name: prometheus-ops
    namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus-ops
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus-ops
subjects:
  - kind: ServiceAccount
    name: prometheus-ops
    namespace: kube-system
