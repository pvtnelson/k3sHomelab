apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 30m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "66.2.2"

      # version: "58.x"

      sourceRef:
        kind: HelmRepository
        name: kube-prometheus-stack
        namespace: monitoring
      interval: 12h
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
  driftDetection:
    mode: enabled
    ignore:
      # Ignore "validated" annotation which is not inserted during install
      - paths: ["/metadata/annotations/prometheus-operator-validated"]
        target:
          kind: PrometheusRule
  values:
    grafana:
      admin:
        existingSecret: grafana-container-env
        userKey: GF_SECURITY_ADMIN_USER
        passwordKey: GF_SECURITY_ADMIN_PASSWORD
      ingress:
        enabled: true
        ingressClassName: traefik
        hosts:
          - grafana.lab.vandesteeg.dev
        path: /
        tls: # served by the lab wildcard certificate (Traefik default TLSStore)
          - hosts:
              - grafana.lab.vandesteeg.dev
    prometheus:
      # No ingress: Prometheus has no login and its lifecycle API (/-/quit, /-/reload) is on,
      # so a LAN name let anyone on the network stop it. Back only behind authentication.
      ingress:
        enabled: false
      prometheusSpec:
        # Keep history across restarts (it lived in an emptyDir before) and cap it.
        retention: 30d
        retentionSize: 15GB
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: local-path
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 20Gi
        # Pick up ServiceMonitors, PodMonitors, Probes and ScrapeConfigs from every
        # namespace, not only those labelled for this Helm release (for the homelab exporters).
        serviceMonitorSelectorNilUsesHelmValues: false
        podMonitorSelectorNilUsesHelmValues: false
        probeSelectorNilUsesHelmValues: false
        scrapeConfigSelectorNilUsesHelmValues: false
