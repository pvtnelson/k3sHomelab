# Home Assistant's built-in Prometheus endpoint (needs `prometheus:` in its configuration.yaml),
# read with a token of a non-admin user, in Secret ha-metrics (created by hand, never in git).
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: home-assistant
  namespace: monitoring
spec:
  metricsPath: /api/prometheus
  scrapeInterval: 60s
  authorization:
    type: Bearer
    credentials:
      name: ha-metrics
      key: token
  staticConfigs:
    - targets: ["homeassistant.home.arpa:8123"]
      labels: { group: home-assistant }
