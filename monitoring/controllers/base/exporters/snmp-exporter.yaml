# SNMP exporter for the NAS and the Omada network gear (router, switch, access point),
# SNMP v3 read-only. The image's built-in modules (if_mib, system, hrStorage, ...) are used
# as they are; only the v3 login is added, read from Secret snmp-nas through environment
# variables (created by hand, never in git).
apiVersion: v1
kind: ConfigMap
metadata:
  name: snmp-exporter-auth
  namespace: monitoring
data:
  auth.yml: |
    auths:
      homelab_v3:
        version: 3
        security_level: authPriv
        username: ${SNMP_USER}
        password: ${SNMP_AUTH}
        auth_protocol: SHA
        priv_protocol: AES
        priv_password: ${SNMP_PRIV}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: snmp-exporter
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels: { app: snmp-exporter }
  template:
    metadata:
      labels: { app: snmp-exporter }
    spec:
      containers:
        - name: snmp-exporter
          image: prom/snmp-exporter:v0.31.0
          args:
            - --config.file=/etc/snmp_exporter/snmp.yml # built-in modules
            - --config.file=/etc/snmp-auth/auth.yml # our v3 login
            - --config.expand-environment-variables
          envFrom:
            - secretRef: { name: snmp-nas } # SNMP_USER, SNMP_AUTH, SNMP_PRIV
          ports:
            - { name: metrics, containerPort: 9116 }
          volumeMounts:
            - { name: auth, mountPath: /etc/snmp-auth }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
      volumes:
        - name: auth
          configMap: { name: snmp-exporter-auth }
---
apiVersion: v1
kind: Service
metadata:
  name: snmp-exporter
  namespace: monitoring
spec:
  selector: { app: snmp-exporter }
  ports:
    - { name: metrics, port: 9116, targetPort: metrics }
---
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: snmp
  namespace: monitoring
spec:
  metricsPath: /snmp
  scrapeInterval: 60s
  params:
    auth: [homelab_v3]
    module: [if_mib,system,hrStorage]
  staticConfigs:
    - targets: [nas.home.arpa]
      labels: { group: nas }
    - targets: [router.home.arpa, switch.home.arpa, ap.home.arpa]
      labels: { group: network }
  relabelings:
    - sourceLabels: [__address__]
      targetLabel: __param_target
    - sourceLabels: [__param_target]
      targetLabel: instance
    - targetLabel: __address__
      replacement: snmp-exporter.monitoring.svc:9116
