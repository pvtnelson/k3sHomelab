# Pi-hole exporter: queries, blocks and clients from Pi-hole v6, with an app password
# in Secret pihole-exporter (created by hand, never in git).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pihole-exporter
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels: { app: pihole-exporter }
  template:
    metadata:
      labels: { app: pihole-exporter }
    spec:
      containers:
        - name: pihole-exporter
          image: ekofr/pihole-exporter:v1.3.1
          envFrom:
            - secretRef: { name: pihole-exporter } # PIHOLE_PASSWORD
          env:
            - { name: PIHOLE_HOSTNAME, value: dns.home.arpa }
            - { name: PIHOLE_PROTOCOL, value: http }
            - { name: PIHOLE_PORT, value: "80" }
            - { name: PORT, value: "9617" }
          ports:
            - { name: metrics, containerPort: 9617 }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: pihole-exporter
  namespace: monitoring
  labels: { app: pihole-exporter }
spec:
  selector: { app: pihole-exporter }
  ports:
    - { name: metrics, port: 9617, targetPort: metrics }
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: pihole-exporter
  namespace: monitoring
spec:
  selector:
    matchLabels: { app: pihole-exporter }
  endpoints:
    - port: metrics
      interval: 60s
