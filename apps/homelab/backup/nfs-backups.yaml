# Backup share on the Asustor NAS. Export /volume1/backups/hermes over NFS to the
# node IPs 10.10.10.40-43 only, writable for uid/gid 10000.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: hermes-backups-pv
spec:
  capacity:
    storage: 20Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain # never touch the NAS data on delete
  storageClassName: ""
  mountOptions:
    - nfsvers=4.1
    - hard
  nfs:
    server: 10.10.10.10
    path: /volume1/backups/hermes
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hermes-backups-pvc
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  volumeName: hermes-backups-pv
  resources:
    requests:
      storage: 20Gi
