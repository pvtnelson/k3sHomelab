apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: hermes
resources:
  - ../../base/hermes
  - nfs-notes.yaml
  - nfs-secondbrain.yaml
  - configmap.yaml
  - ../shared/admin-secret.yaml # dashboard login
  - hermes-env-secret.yaml # SOPS: CLAUDE_CODE_OAUTH_TOKEN (+ later: model API keys, Telegram)
  - hermes-honcho-secret.yaml # SOPS: HONCHO_API_KEY, created by scripts/shell/create-hermes-honcho-secret.sh
