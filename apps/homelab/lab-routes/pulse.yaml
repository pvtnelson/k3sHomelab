apiVersion: v1
kind: Service
metadata:
  name: pulse
  namespace: lab-routes
spec:
  type: ExternalName
  externalName: prometheus.home.arpa
  ports:
    - name: http
      port: 31337
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pulse
  namespace: lab-routes
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - pulse.lab.vandesteeg.dev
  rules:
    - host: pulse.lab.vandesteeg.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pulse
                port:
                  number: 31337
