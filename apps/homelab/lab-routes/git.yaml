apiVersion: v1
kind: Service
metadata:
  name: git
  namespace: lab-routes
spec:
  type: ExternalName
  externalName: nas.home.arpa
  ports:
    - name: http
      port: 3100
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: git
  namespace: lab-routes
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - git.lab.vandesteeg.dev
  rules:
    - host: git.lab.vandesteeg.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: git
                port:
                  number: 3100
