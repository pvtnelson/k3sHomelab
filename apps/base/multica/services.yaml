apiVersion: v1
kind: Service
metadata:
  name: multica-backend
  labels:
    app.kubernetes.io/name: multica-backend
    app.kubernetes.io/part-of: multica
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: multica-backend
---
apiVersion: v1
kind: Service
metadata:
  name: multica-frontend
  labels:
    app.kubernetes.io/name: multica-frontend
    app.kubernetes.io/part-of: multica
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: multica-frontend
