apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes
  labels:
    app.kubernetes.io/name: hermes
spec:
  revisionHistoryLimit: 3
  replicas: 1
  strategy:
    type: Recreate # RWO data volume + single Telegram poller: never run two pods
  selector:
    matchLabels:
      app.kubernetes.io/name: hermes
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hermes
    spec:
      # Without s6 there's no init in the containers; the pod's pause process
      # becomes PID 1 and reaps zombie subprocesses (terminal tool, etc.).
      shareProcessNamespace: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 10000 # image's built-in `hermes` user
        runAsGroup: 10000
        fsGroup: 10000
        seccompProfile:
          type: RuntimeDefault

      # The image's s6-overlay /init expects root, so we bypass it and run the
      # image's own bootstrap + wrapper scripts directly as the hermes user.
      # Kubernetes takes over supervision (restarts) from s6.
      initContainers:
        - name: bootstrap
          image: nousresearch/hermes-agent:v2026.9.24
          command:
            - /bin/sh
            - -c
            - |
              set -e
              # Seed our config only on first boot; Hermes owns the live copy afterwards.
              [ -f /opt/data/config.yaml ] || cp /seed/config.yaml /opt/data/config.yaml
              [ -f /opt/data/honcho.json ] || cp /seed/honcho.json /opt/data/honcho.json
              export PATH="/command:/package/admin/s6/command:${PATH}"
              # Skip stage2's Chromium lookup: it writes to /run/s6 (s6 only) and the
              # browser toolset is disabled anyway.
              export AGENT_BROWSER_EXECUTABLE_PATH=/nonexistent
              /opt/hermes/docker/stage2-hook.sh
              # stage2 runs the config migration via s6-setuidgid, which needs root
              # and fails for us; run it directly as the hermes user instead.
              /opt/hermes/.venv/bin/python /opt/hermes/scripts/docker_config_migrate.py \
                || echo "[bootstrap] WARNING: config migration failed; continuing"
              # Honcho memory plugin needs honcho-ai. Install it through Hermes' own
              # allowlisted lazy installer into /opt/data/lazy-packages (not in backups),
              # so a fresh or restored volume doesn't silently run without memory.
              (cd /opt/hermes && /opt/hermes/.venv/bin/python -c \
                "from tools.lazy_deps import ensure; ensure('memory.honcho')") \
                || echo "[bootstrap] WARNING: honcho-ai install failed; continuing"
              # Claude Code (native build) for the bundled claude-code skill. HOME is
              # /opt/data, so it lands on the PVC in ~/.local/bin (already on the image
              # PATH) and self-updates there. Auth: CLAUDE_CODE_OAUTH_TOKEN in hermes-env.
              if [ ! -x /opt/data/.local/bin/claude ]; then
                curl -fsSL https://claude.ai/install.sh | bash \
                  || echo "[bootstrap] WARNING: Claude Code install failed; continuing"
              fi
              # Multica CLI (agent daemon), pinned + checksum-verified, on the PVC too.
              # Bump both values together when upgrading the Multica server.
              MULTICA_VERSION=0.6.0
              MULTICA_SHA256=7884e3e6c678ac485caf20bce4cc98353e92c6f586ec8df3df3febcb7c8e9e5b
              if ! /opt/data/.local/bin/multica version 2>/dev/null | grep -q "multica ${MULTICA_VERSION} "; then
                (
                  set -e
                  tmp=$(mktemp -d)
                  cd "$tmp"
                  curl -fsSL -o multica.tgz \
                    "https://github.com/multica-ai/multica/releases/download/v${MULTICA_VERSION}/multica-cli-${MULTICA_VERSION}-linux-amd64.tar.gz"
                  echo "${MULTICA_SHA256}  multica.tgz" | sha256sum -c -
                  tar -xzf multica.tgz multica
                  mkdir -p /opt/data/.local/bin
                  install -m 0755 multica /opt/data/.local/bin/multica
                  rm -rf "$tmp"
                ) || echo "[bootstrap] WARNING: Multica CLI install failed; continuing"
              fi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /opt/data
            - name: seed-config
              mountPath: /seed

      containers:
        - name: gateway
          image: nousresearch/hermes-agent:v2026.9.24
          command: ["/opt/hermes/docker/main-wrapper.sh"]
          args: ["gateway", "run"]
          envFrom:
            - secretRef:
                name: hermes-env
                optional: true
            - secretRef:
                name: hermes-honcho
                optional: true # HONCHO_API_KEY (JWT for workspace "hermes") # API keys / Telegram, added later; pod runs without it
          env:
            - name: TERMINAL_CWD
              value: /workspace/notes
            - name: MESSAGING_CWD
              value: /workspace/notes
            - name: OBSIDIAN_VAULT_PATH
              value: /workspace/notes
            # Image default is /opt/data only; without this the agent can't write notes.
            - name: HERMES_WRITE_SAFE_ROOT
              value: /opt/data:/workspace/notes
            - name: HONCHO_BASE_URL # plain HTTP, cluster-internal (no Ingress)
              value: http://honcho-api.hermes.svc.cluster.local:8000
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 250m
              memory: 768Mi
            limits:
              memory: 2Gi # headroom for `claude -p` subprocesses
          volumeMounts:
            - name: data
              mountPath: /opt/data
            - name: notes
              mountPath: /workspace/notes

        - name: dashboard
          image: nousresearch/hermes-agent:v2026.9.24
          command: ["/opt/hermes/docker/main-wrapper.sh"]
          args: ["dashboard", "--host", "0.0.0.0", "--port", "9119", "--no-open"]
          envFrom:
            - secretRef:
                name: hermes-env
                optional: true
            - secretRef:
                name: hermes-honcho
                optional: true # HONCHO_API_KEY (JWT for workspace "hermes") # API keys / Telegram, added later; pod runs without it
          env:
            # Dashboard login = shared homelab admin credentials (apps/homelab/shared)
            - name: HERMES_DASHBOARD_BASIC_AUTH_USERNAME
              valueFrom:
                secretKeyRef:
                  name: admin-secret
                  key: user
            - name: HERMES_DASHBOARD_BASIC_AUTH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: admin-secret
                  key: password
            # Dashboard chat runs the agent in this container; same workspace as the gateway.
            - name: TERMINAL_CWD
              value: /workspace/notes
            - name: MESSAGING_CWD
              value: /workspace/notes
            - name: OBSIDIAN_VAULT_PATH
              value: /workspace/notes
            - name: HERMES_WRITE_SAFE_ROOT
              value: /opt/data:/workspace/notes
            - name: HONCHO_BASE_URL # plain HTTP, cluster-internal (no Ingress)
              value: http://honcho-api.hermes.svc.cluster.local:8000
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: dashboard
              containerPort: 9119
              protocol: TCP
          livenessProbe:
            tcpSocket:
              port: dashboard
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: dashboard
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 384Mi
            limits:
              memory: 1536Mi # 512Mi got OOMKilled during dashboard chat sessions
          volumeMounts:
            - name: data
              mountPath: /opt/data
            - name: notes
              mountPath: /workspace/notes

        # Multica agent daemon: picks up tasks from the Multica board and runs them with
        # the agent CLIs in this image/PVC (`claude`, `hermes`). Needs a one-time
        # `multica login --token` (token saved in /opt/data/.multica); until then the
        # daemon exits and this loop retries instead of crash-looping the pod.
        - name: multica-daemon
          image: nousresearch/hermes-agent:v2026.9.24
          command:
            - /bin/sh
            - -c
            - |
              trap 'kill -TERM "$pid" 2>/dev/null; wait "$pid"; exit 0' TERM INT
              while true; do
                multica daemon start --foreground --no-auto-update &
                pid=$!
                wait "$pid" || true
                echo "[multica-daemon] daemon exited (not logged in yet?); retrying in 60s"
                sleep 60 &
                pid=$!
                wait "$pid"
              done
          envFrom:
            - secretRef:
                name: hermes-env
                optional: true
            - secretRef:
                name: hermes-honcho
                optional: true # HONCHO_API_KEY (JWT for workspace "hermes") # CLAUDE_CODE_OAUTH_TOKEN for Claude Code runs
          env:
            - name: MULTICA_SERVER_URL
              value: http://multica-backend:8080
            - name: MULTICA_APP_URL
              value: https://multica.vandesteeg.dev
            - name: MULTICA_AGENT_RUNTIME_NAME
              value: homelab-hermes
            - name: MULTICA_WORKSPACES_ROOT
              value: /opt/data/multica-workspaces
            # Hermes runs started by Multica use the same workspace as the gateway.
            - name: TERMINAL_CWD
              value: /workspace/notes
            - name: OBSIDIAN_VAULT_PATH
              value: /workspace/notes
            - name: HERMES_WRITE_SAFE_ROOT
              value: /opt/data:/workspace/notes
            - name: HONCHO_BASE_URL # plain HTTP, cluster-internal (no Ingress)
              value: http://honcho-api.hermes.svc.cluster.local:8000
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              memory: 2Gi # agent runs (claude -p / hermes) happen in this container
          volumeMounts:
            - name: data
              mountPath: /opt/data
            - name: notes
              mountPath: /workspace/notes

      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: hermes-data-pvc
        - name: notes
          persistentVolumeClaim:
            claimName: hermes-notes-pvc # provided by the overlay (NFS)
        - name: seed-config
          configMap:
            name: hermes-seed-config
