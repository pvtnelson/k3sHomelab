# Cluster-internal only: no Ingress. Hermes reaches the API at
# http://honcho-api.hermes.svc.cluster.local:8000
apiVersion: v1
kind: Service
metadata:
  name: honcho-api
  labels:
    app.kubernetes.io/name: honcho-api
    app.kubernetes.io/part-of: honcho
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: honcho-api
---
apiVersion: v1
kind: Service
metadata:
  name: honcho-redis
  labels:
    app.kubernetes.io/name: honcho-redis
    app.kubernetes.io/part-of: honcho
spec:
  type: ClusterIP
  ports:
    - port: 6379
      targetPort: redis
      protocol: TCP
      name: redis
  selector:
    app.kubernetes.io/name: honcho-redis
