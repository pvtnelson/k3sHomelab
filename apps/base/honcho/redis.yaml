# Cache only: no persistence, nothing to back up.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: honcho-redis
  labels:
    app.kubernetes.io/name: honcho-redis
    app.kubernetes.io/part-of: honcho
spec:
  revisionHistoryLimit: 3
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: honcho-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: honcho-redis
        app.kubernetes.io/part-of: honcho
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999 # image's built-in `redis` user
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: redis:8.2
          args: ["redis-server", "--save", "", "--appendonly", "no"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: redis
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
