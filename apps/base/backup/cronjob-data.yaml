# Nightly copy of Hermes' /opt/data (memories, skills, config, SQLite) to the NAS.
# hermes-data-pvc is local-path, so this pod is scheduled on the same node as Hermes.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: hermes-backup-data
  labels:
    app.kubernetes.io/name: hermes-backup-data
spec:
  schedule: "30 3 * * *"
  timeZone: Europe/Amsterdam
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app.kubernetes.io/name: hermes-backup-data
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 10000 # hermes user: can read /opt/data
            runAsGroup: 10000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: backup
              image: nousresearch/hermes-agent:v2026.9.24
              command: ["/opt/hermes/.venv/bin/python", "/scripts/backup-data.py"]
              env:
                - name: KEEP
                  value: "7"
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  memory: 512Mi
              volumeMounts:
                # Not readOnly: SQLite needs the -shm file to read a WAL database.
                # The script only reads from it.
                - name: data
                  mountPath: /opt/data
                - name: backups
                  mountPath: /backups
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: hermes-data-pvc
            - name: backups
              persistentVolumeClaim:
                claimName: hermes-backups-pvc # provided by the overlay (NFS)
            - name: scripts
              configMap:
                name: backup-scripts
