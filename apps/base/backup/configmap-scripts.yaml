# Nightly backup scripts. Each run writes to <root>/<YYYY-MM-DD>/ via a temp dir
# (so a failed run never leaves a half-written copy) and keeps the newest KEEP runs.
apiVersion: v1
kind: ConfigMap
metadata:
  name: backup-scripts
data:
  backup-postgres.sh: |
    #!/bin/sh
    set -eu
    root=/backups/postgres
    day=$(date +%F)
    # kube-router admits a new pod into the NetworkPolicy allow-list a few seconds
    # after it starts; until then connections are refused. Wait up to 2 minutes.
    i=0
    until pg_isready -q -t 2; do
      i=$((i + 1))
      [ "$i" -lt 60 ] || { echo "[backup] postgres not reachable" >&2; exit 1; }
      sleep 2
    done
    tmp="$root/.$day.tmp"
    rm -rf "$tmp"
    mkdir -p "$tmp"
    # Roles without password hashes: after a restore, set them again from postgres-secrets.
    pg_dumpall --globals-only --no-role-passwords > "$tmp/globals.sql"
    for db in honcho multica; do
      pg_dump --format=custom --dbname="$db" --file="$tmp/$db.dump"
    done
    rm -rf "${root:?}/$day"
    mv "$tmp" "$root/$day"
    ls -1d "$root"/20??-??-?? | sort | head -n -"$KEEP" | xargs -r rm -rf --
    echo "[backup] postgres -> $root/$day"; ls -la "$root/$day"

  backup-data.py: |
    """Back up Hermes' /opt/data: consistent SQLite copies + a tar of everything else.

    Credentials (.env, auth.json, Multica token) and reinstallable/caches are skipped,
    so no tokens end up unencrypted on the NAS.
    """
    import datetime
    import io
    import os
    import shutil
    import sqlite3
    import tarfile
    from pathlib import Path

    SRC = Path("/opt/data")
    ROOT = Path("/backups/data")
    KEEP = int(os.environ["KEEP"])

    # Caches and tools Hermes / the bootstrap download again on demand: only data is kept.
    SKIP_DIRS = {
        "logs", "cache", "audio_cache", "image_cache", ".cache", "home/.cache", ".npm",
        "lazy-packages", "bin", ".cua-driver", ".local/bin", ".local/share/claude",
        ".local/share/tirith", "multica-workspaces", "secrets",
    }
    SKIP_FILES = {".env", "auth.json", ".multica/config.json", ".claude/.credentials.json"}
    SKIP_SUFFIXES = (".lock", ".sock", ".pid", "-wal", "-shm")
    DB_SUFFIXES = (".db", ".sqlite", ".sqlite3")

    day = datetime.date.today().isoformat()
    tmp = ROOT / f".{day}.tmp"
    shutil.rmtree(tmp, ignore_errors=True)
    (tmp / "sqlite").mkdir(parents=True)


    def skipped(rel: str) -> bool:
        return "node_modules" in rel.split("/") or any(
            rel == d or rel.startswith(d + "/") for d in SKIP_DIRS
        )


    # 1. SQLite: the backup API gives a consistent copy while Hermes keeps writing.
    for path in SRC.rglob("*"):
        rel = path.relative_to(SRC).as_posix()
        if path.is_file() and path.name.endswith(DB_SUFFIXES) and not skipped(rel):
            dest = tmp / "sqlite" / rel
            dest.parent.mkdir(parents=True, exist_ok=True)
            src = sqlite3.connect(f"file:{path}?mode=ro", uri=True, timeout=30)
            dst = sqlite3.connect(dest)
            src.backup(dst)
            dst.close()
            src.close()
            print(f"[backup] sqlite {rel}")


    # 2. Everything else, minus live databases, caches, sockets and credentials.
    # Hermes keeps running, so files can vanish or change mid-walk: each entry is
    # added on its own and small files are read fully before their header is written.
    def rel_of(rel_dir: str, name: str) -> str:
        return name if rel_dir == "." else f"{rel_dir}/{name}"


    def add_entry(tar: tarfile.TarFile, rel: str) -> None:
        path = SRC / rel
        try:
            info = tar.gettarinfo(path, arcname=f"opt-data/{rel}" if rel else "opt-data")
            if info is None or not (info.isfile() or info.isdir() or info.issym()):
                return  # sockets, fifos
            if info.isfile() and info.size <= 64 * 2**20:
                data = path.read_bytes()
                info.size = len(data)
                tar.addfile(info, io.BytesIO(data))
            elif info.isfile():
                with path.open("rb") as f:
                    tar.addfile(info, f)
            else:
                tar.addfile(info)
        except FileNotFoundError:
            pass  # deleted while we were walking (lock / shm / temp files)


    with tarfile.open(tmp / "opt-data.tar.gz", "w:gz") as tar:
        add_entry(tar, "")
        for dirpath, dirnames, filenames in os.walk(SRC):
            rel_dir = Path(dirpath).relative_to(SRC).as_posix()
            dirnames[:] = sorted(d for d in dirnames if not skipped(rel_of(rel_dir, d)))
            for d in dirnames:
                add_entry(tar, rel_of(rel_dir, d))
            for name in sorted(filenames):
                rel = rel_of(rel_dir, name)
                if (
                    rel in SKIP_FILES
                    or rel.endswith(SKIP_SUFFIXES)
                    or rel.endswith(DB_SUFFIXES)
                ):
                    continue
                add_entry(tar, rel)

    final = ROOT / day
    shutil.rmtree(final, ignore_errors=True)
    tmp.rename(final)

    runs = sorted(p for p in ROOT.iterdir() if p.is_dir() and p.name[:2] == "20")
    for old in runs[:-KEEP]:
        shutil.rmtree(old)
    print(f"[backup] data -> {final}")
