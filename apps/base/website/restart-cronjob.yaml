# Nightly rolling restart of the website. The deployment uses :latest with
# imagePullPolicy: Always, so the new pod pulls the newest image (new blog posts).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: website-restart
  labels:
    app.kubernetes.io/name: website-restart
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: website-restart
  labels:
    app.kubernetes.io/name: website-restart
rules:
  - apiGroups:
      - apps
    resources:
      - deployments
    resourceNames:
      - website
    verbs:
      - get
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: website-restart
  labels:
    app.kubernetes.io/name: website-restart
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: website-restart
subjects:
  - kind: ServiceAccount
    name: website-restart
    namespace: website
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: website-restart
  labels:
    app.kubernetes.io/name: website-restart
spec:
  schedule: "0 4 * * *"
  timeZone: Europe/Amsterdam
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app.kubernetes.io/name: website-restart
        spec:
          restartPolicy: Never
          serviceAccountName: website-restart
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: restart
              image: registry.k8s.io/kubectl:v1.36.3
              # Own field manager: Flux reverts changes made by the default
              # kubectl managers, which would trigger a second restart.
              args:
                - rollout
                - restart
                - deployment/website
                - --field-manager=website-nightly-restart
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 64Mi
